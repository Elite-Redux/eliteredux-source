name: ManualBuild

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      MODERN: 0
      COMPARE: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Fetch submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1

      - name: Install build dependencies
        run: sudo apt update && sudo apt install libpng-dev
        # build-essential, git, zip, unzip, java, kotlin, and python are already installed

      - name: Install Arm GNU Toolchain
        # See .github/workflows/build.yml for more comments on how and why
        env:
          ARM_TOOLCHAIN_VERSION: 14.2.rel1
        run: |
          wget -q -O "$RUNNER_TEMP/arm-gnu-toolchain.tar.xz" "https://developer.arm.com/-/media/Files/downloads/gnu/$ARM_TOOLCHAIN_VERSION/binrel/arm-gnu-toolchain-$ARM_TOOLCHAIN_VERSION-x86_64-arm-none-eabi.tar.xz"
          mkdir -p "$RUNNER_TEMP/arm-gnu-toolchain"
          tar xJf "$RUNNER_TEMP/arm-gnu-toolchain.tar.xz" -C "$RUNNER_TEMP/arm-gnu-toolchain" --strip-components=1
          rm "$RUNNER_TEMP/arm-gnu-toolchain.tar.xz"
          echo "$RUNNER_TEMP/arm-gnu-toolchain/bin" >> "$GITHUB_PATH"

      - name: Download poryscript
        run: cd tools && wget https://github.com/huderlem/poryscript/releases/download/3.5.2/poryscript-linux.zip && unzip poryscript-linux.zip -d ./ && rm ./poryscript-linux.zip && mv ./poryscript-linux ./poryscript && ls && cd ..
        # Downloads poryscript and unzips it

      - name: Build ER
        run: pwd && make -j${nproc} DEVKITARM="$RUNNER_TEMP/arm-gnu-toolchain"

      - name: Download pokeemerald repo
        run: pwd && cd tools && git clone https://github.com/pret/pokeemerald
        # Clones pokeemerald repo

      - name: Install agbcc
        run: |
          pwd
          cd tools
          git clone https://github.com/pret/agbcc
          cd agbcc && ./build.sh
          ./install.sh ../pokeemerald
          cd ..
        # Downloads and installs agbcc

      - name: Build pokeemerald repo
        run: pwd && cd tools && cd pokeemerald && pwd && ls && make -j${nproc}
        # builds agbcc to pokeemerald repo

      - name: Build the patch
        run: chmod -R 755 ./flips-linux && ls && ./flips-linux --create tools/pokeemerald/pokeemerald.gba pokeemerald_modern.gba EliteRedux.bps

      - name: Upload bps file
        uses: actions/upload-artifact@v6
        with:
          name: pokeemerald_patch
          path: EliteRedux.bps
