name: ManualBuild

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      MODERN: 0
      COMPARE: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Fetch submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1

      - name: Install build dependencies
        run: sudo apt update && sudo apt install libpng-dev
        # build-essential, git, zip, unzip, java, kotlin, and python are already installed

      - name: Install Arm GNU Toolchain
        # Ubuntu's gcc-arm-none-eabi is too old for -std=gnu23
        run: |
          curl -sSL https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz | tar xJ -C "$RUNNER_TEMP"
          echo "DEVKITARM=$RUNNER_TEMP/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi" >> "$GITHUB_ENV"
      - name: Download poryscript
        run: cd tools && wget https://github.com/huderlem/poryscript/releases/download/3.5.2/poryscript-linux.zip && unzip poryscript-linux.zip -d ./ && rm ./poryscript-linux.zip && mv ./poryscript-linux ./poryscript && ls && cd ..
        # Downloads poryscript and unzips it

      - name: Build ER
        run: pwd && make -j${nproc}

      - name: Download pokeemerald repo
        run: pwd && cd tools && git clone https://github.com/pret/pokeemerald
        # Clones pokeemerald repo

      - name: Install agbcc
        run: |
          pwd
          cd tools
          git clone https://github.com/pret/agbcc
          cd agbcc && ./build.sh
          ./install.sh ../pokeemerald
          cd ..
        # Downloads and installs agbcc

      - name: Build pokeemerald repo
        run: pwd && cd tools && cd pokeemerald && pwd && ls && make -j${nproc}
        # builds agbcc to pokeemerald repo

      - name: Build the patch
        run: chmod -R 755 ./flips-linux && ls && ./flips-linux --create tools/pokeemerald/pokeemerald.gba pokeemerald_modern.gba EliteRedux.bps

      - name: Upload bps file
        uses: actions/upload-artifact@v6
        with:
          name: pokeemerald_patch
          path: EliteRedux.bps
