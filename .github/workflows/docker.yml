name: Docker build

on:
  push:
    branches: [ upcoming ]
  pull_request:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Fetch er-config
        # Only proto: the tree still has a leftover eliteredux-darky gitlink with no URL
        run: git submodule update --init --depth 1 proto

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ROM and BPS
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: bps-artifact
          platforms: linux/amd64
          outputs: type=local,dest=out
          # Toolchain, codegen and host-tool layers are reused between runs
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload ROM and BPS
        uses: actions/upload-artifact@v6
        with:
          name: EliteRedux-docker
          path: out/
