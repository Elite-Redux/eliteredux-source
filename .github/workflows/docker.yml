name: Docker build

on:
  push:
    branches: [ upcoming ]
  pull_request:

jobs:
  docker:
    name: docker (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: EliteRedux
            public: 0
          - name: EliteRedux-public
            public: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Fetch er-config
        run: git submodule update --init --depth 1 proto

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ROM, BPS and symbols
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ci-artifact
          platforms: linux/amd64
          build-args: PUBLIC=${{ matrix.public }}
          outputs: type=local,dest=out
          # Toolchain, codegen and host-tool layers are reused between runs
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Upload BPS and symbols
        if: matrix.public == 1
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: out/
          if-no-files-found: error
