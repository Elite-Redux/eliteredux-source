<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <textarea class="widetextarea" name="" id="textarea_in"></textarea>
    <textarea class="widetextarea" name="" id="textarea_out"></textarea>
    <!--div class="aaa">
        <button id="workplease">Work please</button>
    </div-->
	<div class="flex half">
		<span>Down put the text you want the trainer to have</span>
	</div>
	<textarea class="smalltextarea" name="" id="textarea_trainertext" placeholder="put the engagement battle text"></textarea>
	<hr>
	<textarea class="widetextarea" name="" id="quick_in"></textarea>
	<select name="" id="quick_in_sel">
		<option value="0">tagBattle</option>
	</select>
	<textarea class="widetextarea" name="" id="quick_out"></textarea>
</body>
<script>
    function convert(text){
	data = getTrainerDataFromScript(text.split('\n').map(x => x.trim()).filter(x => x))
	trainerText = document.getElementById('textarea_trainertext').value.trim() || `{COLOR GREEN}hint{COLOR DARK_GRAY}.`
	return `script ${data.scriptName}{
	lock
	faceplayer
	if (defeated(${data.trainer})){
		msgbox(${data.passed}, MSGBOX_AUTOCLOSE)
	} else {
		msgbox(format("${trainerText}"), MSGBOX_YESNO)
		if (var(VAR_RESULT)){
			trainerbattle_single(${data.trainer}, ${data.intro} , ${data.defeat})
		}
	}
	release
	end
}`
}

function getTrainerDataFromScript(array){
	const battleData = array[1].split(/[, ]/).filter(x => x)
	while(true){
		if (array[2] == undefined) throw "couldn't find msgbox"
		if (array[2].match("msgbox")) break
		array.splice(2, 1)
	}
    const afterData =  array[2].split(/[, ]/).filter(x => x)
	if(battleData[0] == "trainerbattle"){
		return {
			scriptName: array[0].replace(/:.*/, ''),
			trainer: battleData[2],
			intro: battleData[4],
			defeat: battleData[5],
            passed: afterData[1],
		}
	} else {

		return {
			scriptName: array[0].replace(/:.*/, ''),
			trainer: battleData[1],
			intro: battleData[2],
			defeat: battleData[3],
            passed: afterData[1],
		}
	}
	
}

function toClipBoard(text){
	navigator.clipboard.writeText(text)
}

function parseInput(){
    const text = convert(document.getElementById('textarea_in').value)
    document.getElementById('textarea_out').value = text
    //toClipBoard(text)
}

document.getElementById('textarea_in').addEventListener('keyup', parseInput)
document.getElementById('textarea_in').addEventListener('paste', parseInput)

function quickTExternText(){
	document.getElementById('quick_out').value = ""
	const val = document.getElementById('quick_in').value
	const table = val.split('\n').filter(x => x.trim())
	for (line of table){
		const outVal = `extern const u8 ${line}[];`
		if (document.getElementById('quick_out').value) document.getElementById('quick_out').value += '\n'
		document.getElementById('quick_out').value += outVal
	}
}

function quickTMergeTagBattle(val){
	const lines = val.split('\n')
					 .filter(x => x.trim())
					 .map(x => x.replace(/@.*/, ''))
	
	const data = []
	const _data = ()=>{return data[data.length -1]}
	const C_VAR = /[a-zA-Z_0-9]+/
	const scriptTable = [
		[/\w+::/, function(line){
			data[data.length] = {}
			_data().fullsname = line.replace(/[:]+/, '')
			_data().tname = line.match(/EventScript_\w+/)[0].replace('EventScript_', '')
			_data().sname = line.match(/[a-zA-Z_0-9]+EventScript_/)[0].replace('EventScript_', '')
		}],
		[/trainerbattle_single\s/, function(line){
			line = line.split(/[, ]/).filter(x => x)
			_data().trainer = line[1]
			_data().intro = line[2]
			_data().defeat = line[3]
		}],
		[/msgbox/, function(line){
			line = line.split(/[, ]/).filter(x => x)
			_data().post = line[1]
		}],
		[/end/, function(){

		}]
	]
	for(const line of lines){
		for (const script of scriptTable){
			if (line.match(script[0])){
				if (!script[1](line)) break;
				
			}
		}
	}
	const TAG_TEAM = `TAG_TEAM_${data[0].tname.toUpperCase()}_${data[1].tname.toUpperCase()}`
	document.getElementById('textarea_out').value = `#define ${TAG_TEAM}${" ".repeat(41 - TAG_TEAM.length )}
case ${TAG_TEAM}:
        	if(!isTrainerB)
		        return ${data[0].defeat};
	        else
		        return ${data[1].defeat};
        break;	
`
	data.forEach(x => {
		const outVal = `extern const u8 ${x.defeat}[];`
		if (document.getElementById('textarea_out').value) document.getElementById('textarea_out').value += '\n'
		document.getElementById('textarea_out').value += outVal
	})
	const template = `script ${data[0].sname}EventScript_${data[0].tname}And${data[1].tname}{
    msgbox(format("{COLOR GREEN}Hint.{COLOR DARK_GRAY}"), MSGBOX_AUTOCLOSE)
    msgbox(format("{COLOR GREEN}Hint.{COLOR DARK_GRAY}"), MSGBOX_AUTOCLOSE)
    msgbox(format("Generic battle askance"), MSGBOX_YESNO)
    if (var(VAR_RESULT)){
        starttagbattle(${data[0].trainer}, ${data[1].trainer}, ${TAG_TEAM},\
 0, ${data[0].sname}Text_${data[0].tname}And${data[1].tname}Intro)
    }
    release
    end
}

script ${data[0].fullsname}{
	lock
	faceplayer
	if (defeated(${data[0].trainer})){
		msgbox(${data[0].post}, MSGBOX_AUTOCLOSE)
	} else {
		goto(${data[0].sname}EventScript_${data[0].tname}And${data[1].tname})
	}
	release
	end
}

script ${data[1].fullsname}{
	lock
	faceplayer
	if (defeated(${data[1].trainer})){
		msgbox(${data[1].post}, MSGBOX_AUTOCLOSE)
	} else {
		goto(${data[0].sname}EventScript_${data[0].tname}And${data[1].tname})
	}
	release
	end
}`;
document.getElementById('quick_out').value = template
}


function quickTransform(){
	const scriptTable = [
		quickTMergeTagBattle
	]
	scriptTable[document.getElementById('quick_in_sel').value](document.getElementById('quick_in').value)
	
	
}
document.getElementById('quick_in').addEventListener('keyup', quickTransform)
document.getElementById('quick_in_sel').addEventListener('change', quickTransform)
